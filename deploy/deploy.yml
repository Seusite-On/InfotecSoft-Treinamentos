# Publica o portal em zenim.me (hospedagem de sites da Hostinger) a cada "git push" na branch main.
# Secrets necessários: SSH_HOST, SSH_PORT, SSH_USER, SSH_KEY, DB_NAME, DB_USER, DB_PASSWORD (GitHub > Settings > Secrets)
name: Publicar em zenim.me (Hostinger)

# Automático desligado (Actions bloqueado na conta). Publicação feita pelo PC: publicar-hostinger.bat
# Para voltar ao automático, troque o bloco abaixo por:  push: { branches: [main] }
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  SITE_URL: https://zenim.me
  APP_DIR: domains/zenim.me        # relativo à pasta do usuário na Hostinger; public_html fica aqui dentro

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SSH_HOST }}
      PORT: ${{ secrets.SSH_PORT }}
      USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir sintaxe do PHP
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l > /dev/null && echo "PHP OK"

      - name: Preparar acesso SSH
        run: |
          test -n "$HOST" || { echo "::error::Secret SSH_HOST não configurado"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" | tr -d '\r' | sed -n '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/p' > ~/.ssh/deploy_key
          grep -q 'BEGIN' ~/.ssh/deploy_key || { echo "::error::Secret SSH_KEY sem a chave (cole o conteúdo do arquivo CHAVE-PRIVADA-GITHUB.txt)"; exit 1; }
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -p $PORT -o BatchMode=yes $USER@$HOST" >> "$GITHUB_ENV"

      - name: Empacotar arquivos
        run: |
          tar czf /tmp/site.tgz \
            --exclude=./.git --exclude=./.github --exclude=./frontend --exclude=./deploy \
            --exclude=./.env --exclude=./vendor \
            --exclude=./storage/videos --exclude=./storage/thumbs --exclude=./storage/security --exclude='./storage/*.txt' \
            --exclude='./*.bat' --exclude='./*.ps1' --exclude=./index.html --exclude=./LEIA-ME.txt \
            .
          ls -lh /tmp/site.tgz

      - name: Enviar para a Hostinger
        run: |
          $SSH "mkdir -p $APP_DIR"
          $SSH "tar xzf - -C $APP_DIR" < /tmp/site.tgz

      - name: Gravar .env do servidor
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$DB_NAME" || { echo "::error::Secrets DB_NAME/DB_USER/DB_PASSWORD não configurados"; exit 1; }
          printf 'DB_HOST=localhost\nDB_PORT=3306\nDB_USERNAME=%s\nDB_PASSWORD=%s\nDB_DATABASE=%s\nUPLOAD_MAX_MB=2048\n' "$DB_USER" "$DB_PASSWORD" "$DB_NAME" \
            | $SSH "cat > $APP_DIR/.env && chmod 600 $APP_DIR/.env"

      - name: Atualizar banco e testar
        run: |
          $SSH 'cd '"$APP_DIR"' && mkdir -p storage/videos storage/thumbs storage/security \
            && rm -f public_html/default.php \
            && PHP=$( [ -x /opt/alt/php83/usr/bin/php ] && echo /opt/alt/php83/usr/bin/php || command -v php ) \
            && echo "PHP: $($PHP -r "echo PHP_VERSION;")" \
            && $PHP database/scripts/migrate.php && $PHP database/scripts/seed.php && $PHP tests/smoke.php'

      - name: Conferir o site no ar
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/state")
          echo "GET $SITE_URL/api/state -> HTTP $code"
          test "$code" = "200"
